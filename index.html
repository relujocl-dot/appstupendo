<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#061936">
  <title>Stupendo App</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root{--bg:#061936;--panel:#0b2448;--line:rgba(205,163,73,.28);--gold:#cda349;--text:#eef4ff;--muted:#a9b8d2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    main{width:min(100% - 28px,760px);display:grid;gap:18px}
    header{display:grid;gap:6px;text-align:center}
    h1{margin:0;font-size:clamp(32px,6vw,52px);line-height:1;color:#fff}
    p{margin:0;color:var(--muted);font-weight:700}
    nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    a{display:grid;gap:8px;min-height:150px;padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#0d2d5c,var(--panel));color:var(--text);text-decoration:none;box-shadow:0 18px 48px rgba(0,0,0,.28)}
    strong{font-size:24px;color:#fff}
    span{color:var(--muted);font-weight:700;line-height:1.35}
    small{align-self:end;color:var(--gold);font-weight:900;text-transform:uppercase;letter-spacing:.06em}
    @media(max-width:640px){nav{grid-template-columns:1fr}a{min-height:128px}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Stupendo App</h1>
      <p>Acceso interno para operación y finanzas.</p>
    </header>
    <nav aria-label="Módulos">
      <a href="/agenda/">
        <strong>Agenda</strong>
        <span>Reservas, operadores, pagos, leads y reserva rápida.</span>
        <small>Entrar</small>
      </a>
      <a href="/finanzas/">
        <strong>Finanzas</strong>
        <span>Panel financiero, reportes, impuestos y métricas.</span>
        <small>Entrar</small>
      </a>
    </nav>
  </main>
</body>
</html>
